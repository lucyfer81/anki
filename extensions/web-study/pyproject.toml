[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webstudy"
version = "0.1.0"
requires-python = ">=3.12"
# Anki is deliberately installed from a local source build, not an index.
dependencies = [
  "fastapi>=0.115,<1",
  "httpx2>=2.16,<3",
  "jinja2>=3.1,<4",
  "pyjwt[crypto]>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend = "../../.ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["tests", "webstudy"]
