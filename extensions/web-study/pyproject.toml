[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webstudy"
version = "0.1.0"
requires-python = ">=3.12"
# Anki is deliberately installed from a local source build, not an index.

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
