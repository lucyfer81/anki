{% extends "base.html" %}
{% block title %}登录 · Anki 单词卡{% endblock %}
{% block body %}
<h1>Anki 单词卡</h1>
{% if message %}<p role="alert">{{ message }}</p>{% endif %}
<form action="/login" method="post">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <label>账号 <select name="user"><option value="a">A</option><option value="b">B</option></select></label>
  <label>密码 <input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">登录</button>
</form>
{% endblock %}
