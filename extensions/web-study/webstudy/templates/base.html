<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Anki 单词卡{% endblock %}</title>
  <style>
    body { font: 1rem/1.55 system-ui, sans-serif; max-width: 45rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .8rem; }
    label { display: block; margin: .75rem 0; }
    button, input, select { font: inherit; }
    button { margin: .25rem 0; padding: .35rem .6rem; }
    article, section { border: 1px solid #999; padding: .75rem 1rem; border-radius: .5rem; margin: 1rem 0; }
    .vocab { white-space: pre-wrap; overflow-wrap: anywhere; }
    .choices { display: flex; flex-wrap: wrap; gap: .5rem; }
  </style>
</head>
<body>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
